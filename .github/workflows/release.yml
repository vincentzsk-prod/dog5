# DØG-5 (fork of OberVave): build the packages on GitHub, run the host tests, and on a tag vX.Y publish the release with a build
# attestation (actions/attest-build-provenance): the Firmware Hub shows "Built from source" for exactly these files.
# The JieLi toolchain and the AC79 SDK come from this repo's own release build-deps-v1 (tools/get_vendored_deps.sh: the same
# pinned pair as pkgman.jieliapp.com + gitee.com, which tools/get_toolchain.sh still fetches by hand). FM-1 only (the
# SMK-37 board was removed in Batch 13). Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain + AC79 SDK (our build-deps-v1 release; three SDK files are placed in the package)
        run: sh tools/get_vendored_deps.sh

      - name: Build (FM-1)
        run: sh build.sh

      # blocking since Batch 12B (the stale expectations fixed): a red test stops the release
      - name: Host tests
        run: sh tests/run_tests.sh

      - name: Release packages (tags only)
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          sh build.sh --release "$V"
          ls -l build/dog5-"$V"*.fwsc
          mkdir -p dist && cp build/dog5-"$V".fwsc dist/dog5.fwsc   # one stable asset name every release (the Hub updates in place)
          (cd dist && sha256sum dog5.fwsc > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dog5-fwsc
          path: build/dog5*.fwsc
          if-no-files-found: error

      - name: Attest the packages (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/dog5.fwsc

      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dog5.fwsc
            dist/SHA256SUMS
          body_path: .github/release-header.md   # the flash-chip note, up front (GitHub's own notes follow it)
          generate_release_notes: true
